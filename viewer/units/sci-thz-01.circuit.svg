<text x="602" y="636" font-size="10.5" fill="#445">需求:漂移 &lt; 0.37 MHz = 2 ppm@×12;自由 DRO 温漂 10–100+ ppm/sol,差 1–2 量级</text>
<text x="602" y="654" font-size="10.5" fill="#2e8b57">锁相后残余 &lt; 2 kHz,余量 &gt; 400×;OCXO 同时作频谱仪采样钟基准</text>
<text x="602" y="672" font-size="10" fill="#889">SSB 斜率 1.55 K/MHz @3 MHz 通道 —— 折叠的一阶免疫把需求放松一个量级,但放不了两个</text>

