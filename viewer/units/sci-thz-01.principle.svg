<rect x="34" y="528" width="482" height="132" rx="6" fill="#fff" stroke="#d8d2c4"/>
<text x="48" y="550" font-size="12.5" fill="#223" font-weight="bold">火星把地球仪器的频率轴缩了 81×</text>
<text x="48" y="572" font-size="11.5" fill="#445">γ(地面)= 37 MHz(6.1 hPa CO₂ ×1.6 展宽比)vs 地球 3.02 GHz;多普勒 224 kHz,59 km 以上接管</text>
<text x="48" y="592" font-size="11.5" fill="#445">线心 τ = 3.5(10 pr-µm)光学厚;远翼对着 0.4 K 微波背景 → 发射对比度 ~190 K</text>
<text x="48" y="612" font-size="11.5" fill="#445">强度锚:地球海平面复算 28.0 dB/km 正中 ITU 基准;CO₂ 无偶极矩 → 火星微波天空干净</text>
<text x="48" y="646" font-size="11" fill="#8a5a18">绝对标度背 γ_CO2 ±10%(待实验室气室);p0 与 T(z) 由气象站实测供给(评审 F4/F5 后规格)</text>

