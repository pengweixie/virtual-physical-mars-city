<text x="1114" y="312" font-size="11.5" fill="#445">柱含量:0.45% @1 s → 平台 0.12%(1e-4 增益底);1 pr-µm 冬季低值 ~10 s 进 1%</text>
<text x="1114" y="332" font-size="11.5" fill="#445">粗廓线:DOF 3.76(线性)/3.21(核迹);层误差 6/19/17/29%(先验 50%)</text>
<text x="1114" y="352" font-size="11.5" fill="#8a5a18">20–40 km 层 57% 是先验 → 作「受约束上界」发布,不当测量值</text>
<text x="1114" y="372" font-size="11.5" fill="#445">误差棒:解析 0.34% 低估蒙卡 0.90% 约 3× → 对外用蒙卡数</text>
<rect x="1100" y="416" width="422" height="132" rx="6" fill="#fff" stroke="#d8d2c4"/>
