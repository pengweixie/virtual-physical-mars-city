<rect width="1560" height="780" fill="#fdfcf8"/>
<text x="780" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#223">sci-thz-01 · 183 GHz 水汽廓线辐射计 — 探测原理 / Sounding Principle</text>
<text x="780" y="56" text-anchor="middle" font-size="12" fill="#667">压致展宽把「偏置频率」变成「高度旋钮」;摆镜一个机构做四件事;数字为 2026-08-09 评审后冻结口径(out/*.json)</text>

