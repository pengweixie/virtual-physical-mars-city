<text x="1114" y="460" font-size="11.5" fill="#445">← T(z):气象站+GCM(尘暴盲 +12.05%、36% 不收敛 → +3.89%,3.1×)</text>
<text x="1114" y="480" font-size="11.5" fill="#445">← p0:气象站气压计(季节 ±10–15%;固定 610 Pa 反演 +10% 偏柱 −2.5%)</text>
<text x="1114" y="500" font-size="11.5" fill="#445">← 地表温:sci-weather-01 / sci-ir-01(红外表皮 ≠ 毫米波亮温,差 ~18 K)</text>
<text x="1114" y="520" font-size="11.5" fill="#2e8b57">→ 尘暴期接棒:尘对 183 GHz 透明(τ≈1.2e-3 @τ_vis=5),光学瞎时本机在岗</text>
<text x="1114" y="540" font-size="10.5" fill="#667">未扣地面拾取(1.49 K)会让反演整体发散 —— 地面停位是可用/不可用分界</text>
<rect x="1100" y="568" width="422" height="92" rx="6" fill="#fff" stroke="#d8d2c4"/>
<text x="1114" y="590" font-size="12.5" font-weight="bold" fill="#223">灵敏度为什么够(千分之一水汽)</text>
<text x="1114" y="612" font-size="11.5" fill="#445">线窄 81× → 同样分子的峰值截面抬 81×;背景是 0.4 K 近黑冷空</text>
<text x="1114" y="632" font-size="11.5" fill="#445">发射测量:τ~0.01 也是 ~2 K 信号,对 NEΔT ~0.1 K —— 够且富余</text>

